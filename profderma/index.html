<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ПрофДерма"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes">

<title>ПрофДерма</title>

<style>/* ProfDerma Web 2.1. Conventional business application interface. */
:root{--ink:#27313b;--muted:#66717d;--line:#d1d7de;--soft:#f4f6f8;--brand:#245d89;--brand-dark:#174365;--danger:#a33434;--radius:3px}
*{box-sizing:border-box}
html{min-width:280px;scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 "Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
a{color:var(--brand)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #326b98;outline-offset:2px}
button,input,select,textarea{border-radius:var(--radius)}
input,select,textarea{width:100%;min-width:0;border:1px solid #b9c2cc;background:#fff;color:var(--ink);padding:6px 9px;min-height:35px;line-height:1.4}
select{padding-right:25px}
textarea{resize:vertical;min-height:65px}
input::placeholder,textarea::placeholder{color:#798490}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--danger)}
button{border:0}
h1,h2,h3,p{margin-top:0}
h1{font-size:21px;line-height:1.35;font-weight:600;margin-bottom:4px}
h2{font-size:16px;line-height:1.4;font-weight:600;margin-bottom:12px}
h3{font-size:14px;line-height:1.5;font-weight:600;margin-bottom:7px}
p{margin-bottom:12px}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.btn{min-height:35px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 12px;white-space:nowrap;color:#fff;background:var(--brand);border:1px solid var(--brand);font-size:13px;font-weight:500;text-decoration:none}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.secondary,.btn.soft{color:var(--ink);background:#fff;border-color:#bac4cf}
.btn.secondary:hover,.btn.soft:hover{background:#eaf0f5;border-color:#9aaaba}
.btn.ghost{background:transparent;color:var(--brand);border-color:transparent}
.btn.ghost:hover{background:#edf3f7}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12px}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.danger-text{color:var(--danger)}
.full{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:31px;min-height:31px;border:1px solid transparent;background:transparent;color:var(--muted);padding:5px}
.icon-btn:hover{border-color:var(--line);background:var(--soft)}
.shell{min-height:100vh;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 26px;background:#fff;border-bottom:1px solid var(--line);min-height:65px}
.app-identity{display:flex;align-items:center;gap:18px;min-width:0}
.app-name{font-size:20px;color:#24475f;font-weight:600;white-space:nowrap;letter-spacing:-.2px}
.app-caption{border-left:1px solid var(--line);padding-left:18px;font-size:13px;color:var(--muted)}
.session{display:flex;align-items:center;gap:18px;flex-shrink:0}
.session-user{font-size:13px;line-height:1.35;text-align:right;max-width:200px;overflow-wrap:anywhere}
.session-user small{display:block;font-size:11px;color:var(--muted)}
.menu-bar{display:flex;gap:0;align-items:stretch;min-height:44px;border-bottom:1px solid #bdc7d1;background:#f2f4f6;padding:0 20px}
.menu-bar>button{display:flex;align-items:center;gap:7px;padding:10px 16px;font-size:13px;background:transparent;color:#475461;border-radius:0;border:0;border-bottom:2px solid transparent;white-space:nowrap}
.menu-bar>button:hover{background:#e8edf2;color:#223d52}
.menu-bar>button.active{background:#fff;color:#1f547d;border-bottom-color:#245d89;font-weight:600}
.nav-count{font-size:11px;border:1px solid #c7d0da;background:#f4f6f8;min-width:19px;line-height:17px;text-align:center;border-radius:2px}
.app-version{font-size:12px;color:var(--muted);align-self:center;margin-left:auto;white-space:nowrap;padding:0 4px 0 20px}
.demo-strip{display:flex;align-items:center;gap:8px;background:#fffbee;color:#705e32;border-bottom:1px solid #e6dec3;padding:8px 27px;font-size:12px}
.demo-strip>span{flex:1}
.strip-action{background:transparent;padding:0;color:#705e32;font-size:12px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.main{width:100%;max-width:1500px;margin:0 auto;flex:1;padding:24px 28px 40px;outline:none}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.page-head>div:first-child{min-width:0}
.page-head h1{overflow-wrap:anywhere}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.registry-panel{border:1px solid #c9d1d9;border-radius:3px;overflow:hidden}
.filter-bar{display:flex;align-items:center;gap:14px;padding:13px 14px;background:#f6f7f9;border-bottom:1px solid var(--line)}
.search{display:block;position:relative;flex:1;min-width:150px}
.search .icon{position:absolute;left:10px;top:10px;color:#778390}
.search input{padding-left:32px;font-size:13px}
.filter-select{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.filter-select select{width:205px;font-size:13px;color:var(--ink)}
.table-wrap{overflow-x:auto;width:100%;outline-offset:-2px}
table{border-collapse:collapse;border-spacing:0;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:middle;padding:12px;border-bottom:1px solid #dde2e7;overflow-wrap:anywhere}
th{background:#eef1f4;color:#424e5a;font-size:12px;font-weight:600}
.registry-table{min-width:1050px;table-layout:fixed}
.registry-table th{padding:10px 12px;line-height:1.4;border-right:1px solid #dbe0e5}
.registry-table th:last-child{border-right:0}
.registry-table td{font-size:13px;padding:14px 12px;line-height:1.45}
.registry-table tbody tr:nth-child(even){background:#fafbfc}
.registry-table tbody tr:hover{background:#eef5fa}
.registry-table tbody tr:last-child td{border-bottom:0}
.col-code{width:11%}.col-date{width:10%}.col-profession{width:19%}.col-genotype{width:8%}.col-contact{width:10%}.col-route{width:18%}.col-status{width:15%}.col-open{width:9%}
.table-link,.case-title{padding:0;color:#245d89;font-size:13px;text-align:left;background:transparent;text-decoration:underline;text-decoration-color:#b6c9d8;text-underline-offset:3px;line-height:1.45}
.case-title{font-weight:600;overflow-wrap:anywhere;white-space:normal}
.table-link:hover,.case-title:hover{text-decoration-color:currentColor}
.mono{font-family:Consolas,"Courier New",monospace;letter-spacing:0}
.genotype{font-variant-numeric:tabular-nums;white-space:normal}
.record-status{font-size:12px;line-height:1.4;color:#3d4b55}
.record-status.green{color:#356147}.record-status.amber{color:#856123}.record-status.purple{color:#665877}
.registry-status{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted);padding:10px 14px;background:#f5f7f9;border-top:1px solid var(--line)}
.workspace-note{margin:17px 0 0;font-size:12px;line-height:1.75;color:var(--muted);max-width:1050px}
.page-footer{border-top:1px solid var(--line);padding:11px 28px;background:#f7f8f9;font-size:11px;color:var(--muted);display:flex;gap:20px;justify-content:space-between}
.empty{padding:44px 25px;text-align:center}
.empty p{font-size:13px;color:var(--muted)}
.record-form{border:1px solid var(--line);border-radius:3px;background:#fff;max-width:1240px}
.form-caption{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 18px;background:#f5f7f9;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.required{color:#9c3333}
.form-section{margin:22px 20px 17px;padding:14px 0 0;border:0;border-top:1px solid var(--line);min-width:0}
.form-section legend{font-size:14px;font-weight:600;padding:0 12px 0 0;color:#354756}
.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:25px;row-gap:0}
.identity-fields{grid-template-columns:minmax(170px,.65fr) minmax(170px,.55fr) minmax(250px,1.7fr)}
.field{margin:0 0 14px;min-width:0}
.field>label{display:block;font-size:13px;font-weight:500;margin:0 0 6px;color:#35434f}
.field-help{font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px}
.tenure-help{margin-top:-8px;margin-bottom:12px}
.inline-note{font-size:11px;color:var(--muted);margin:0}
.form-check{padding:11px 18px;border-top:1px solid var(--line);background:#f9fafb;font-size:12px;line-height:1.65}
.form-actions{display:flex;align-items:center;gap:9px;padding:14px 18px;background:#f5f7f9;border-top:1px solid var(--line)}
.form-actions>span{font-size:11px;color:var(--muted);margin-left:auto}
.error-box{background:#fff5f4;border:1px solid #db9a96;color:#8b3333;font-size:13px;padding:12px 16px;margin:16px 20px}
.error-box p{margin:7px 0 0}
#auth-error .error-box,#user-error .error-box{margin:0 0 16px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#567084;font-size:12px;background:transparent;padding:0;margin-bottom:13px}
.back-link:hover{text-decoration:underline}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid #bbc6d1;margin:0 0 22px;gap:4px}
.tabs button{background:#f3f5f7;border:1px solid #cbd3dc;border-bottom:0;border-radius:3px 3px 0 0;padding:9px 18px;font-size:13px;color:#52616e;margin-bottom:0}
.tabs button.active{font-weight:600;color:#23567d;background:#fff;position:relative}
.tabs button.active:after{content:"";height:2px;background:#fff;position:absolute;left:0;right:0;bottom:-1px}
.document-panel{max-width:1100px;border:1px solid #cfd5dc;padding:28px 35px;margin:0 auto;background:#fff}
.card{border:1px solid var(--line);border-radius:3px;background:#fff;min-width:0}
.pad{padding:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line);background:#f7f8fa}
.card-head h2{margin:0;font-size:15px}
.card-foot{font-size:11px;color:var(--muted);background:#f7f8fa;border-top:1px solid var(--line);padding:10px 17px}
.facts{margin:16px 0 0}
.facts>div{display:grid;grid-template-columns:280px minmax(0,1fr);border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.facts dt{font-weight:500;color:#52616c;background:#f6f8f9;padding:9px 12px}
.facts dd{margin:0;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.history-table{min-width:650px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1250px}
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.method-step{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:17px 0 8px}
.method-step:last-child{border-bottom:0}
.method-step p,.limits p{font-size:13px;color:#576570;line-height:1.75}
.step-number{min-width:21px;color:var(--muted);font-size:13px;font-weight:600}
.origin{display:inline-flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid #ccd4dc;background:#f4f6f8;border-radius:2px;font-size:11px;color:#566779}
.origin.addition{background:#f9f6ed;border-color:#d9cfb2;color:#786339}
.origin .icon{width:13px;height:13px}
.info-note{display:flex;align-items:flex-start;gap:9px;border:1px solid #cdd9e2;background:#f5f8fa;padding:12px;font-size:12px;line-height:1.75}
.info-note .icon{margin-top:3px;color:#5b7285}
.info-note p{margin:0}
.info-note.amber{background:#fffaf0;border-color:#ded3b7;color:#71613c}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid #cbd4dd;padding:2px 6px;font-size:11px;border-radius:2px;vertical-align:middle;background:#f4f6f8;color:#53616f}
.badge .icon{width:13px;height:13px}
.badge.green{color:#41644b}.badge.purple{color:#695f79}.badge.amber{color:#85632d}
.avatar{display:inline-flex;align-items:center;justify-content:center;min-width:33px;height:33px;border:1px solid #c9d3db;background:#f2f5f7;border-radius:3px;color:#466072;font-size:12px;font-weight:600}
.rule{border-top:1px solid var(--line);margin:17px 0}
.flex{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:18px}
.small{font-size:12px}.muted{color:var(--muted)}.nowrap{white-space:nowrap}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb0{margin-bottom:0}
.auth-shell{min-height:100vh;display:flex;flex-direction:column;background:#f6f7f9}
.auth-content{flex:1;padding:48px 22px 40px}
.auth-panel{margin:0 auto;background:#fff;border:1px solid #c9d2dc;border-radius:3px;max-width:435px;padding:28px 32px}
.auth-panel h1{font-size:20px;margin-bottom:10px}
.auth-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:23px}
.auth-panel .field{margin-bottom:17px}
.auth-panel .field label{font-size:13px}
.auth-divider{text-align:center;font-size:12px;color:var(--muted);margin:17px 0}
.auth-notice{font-size:11px;color:var(--muted);line-height:1.7;margin:13px 0 0}
.auth-mode{background:transparent;color:var(--brand);font-size:12px;margin-top:15px;padding:0;text-decoration:underline;text-underline-offset:2px}
.auth-disclaimer{font-size:11px;line-height:1.75;color:var(--muted);max-width:435px;margin:16px auto 0}
.password-wrap{position:relative}
.password-wrap input{padding-right:41px}
.password-wrap .icon-btn{position:absolute;right:3px;top:2px}
dialog{border:1px solid #aebdca;border-radius:4px;padding:25px;max-width:560px;width:calc(100% - 32px);max-height:calc(100dvh - 40px);color:var(--ink);background:#fff;box-shadow:0 12px 35px #00000025}
dialog::backdrop{background:#172c4144}
dialog h2{font-size:18px;padding-right:25px}
dialog p{font-size:13px;line-height:1.7;color:#5b6874}
.dialog-close{position:absolute;right:9px;top:9px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}
.audit-event{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding:11px 0;font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);width:max-content;padding:10px 16px;background:#294457;color:#fff;border:1px solid #1e394c;border-radius:3px;z-index:100;display:none;font-size:13px;box-shadow:0 4px 15px #0002}
.toast.show{display:block}.toast.error{background:#873a39;border-color:#742b2b}
.initial-loader{padding:60px 25px;text-align:center;color:var(--muted)}
.sr-only,.hidden{position:absolute!important;clip:rect(0,0,0,0)!important;width:1px!important;height:1px!important;padding:0!important;overflow:hidden!important;white-space:nowrap!important;border:0!important}
[hidden]{display:none!important}
.skip{position:fixed;top:-60px;left:12px;padding:8px 12px;background:#fff;z-index:200;border:2px solid var(--brand)}
.skip:focus{top:8px}
.print-report{display:none}
@media(max-width:1120px){.app-caption{max-width:365px;font-size:12px}.filter-bar{flex-wrap:wrap}.search{flex-basis:40%}.filter-select{flex:1}.filter-select select{width:100%}.filter-bar>.toolbar{width:100%}.page-head{align-items:flex-start}.page-head>.toolbar{justify-content:flex-end}.identity-fields{grid-template-columns:1fr 1fr}.identity-fields>.field:last-child{grid-column:1/-1}.settings-grid,.method-grid{gap:15px}.facts>div{grid-template-columns:210px minmax(0,1fr)}}

nt-size:12px}.error-box{margin:12px 14px;font-size:12px}.tabs{gap:3px}.tabs button{padding:9px 11px;font-size:12px}.document-panel{padding:20px 15px}.settings-grid,.method-grid{grid-template-columns:1fr}.facts>div{grid-template-columns:38% minmax(0,1fr);font-size:12px}.facts dt,.facts dd{padding:8px}.pad{padding:16px}.card-head{padding:12px 14px}.auth-content{padding:28px 16px}.auth-panel{padding:24px 22px}.auth-panel h1{font-size:20px}.info-note{font-size:12px}dialog{padding:23px 18px}.audit-event{flex-wrap:wrap;gap:5px}.toast{bottom:17px;font-size:12px}}
@media(max-width:390px){.menu-bar>button{padding:10px 9px}.menu-bar>button:nth-child(3),.menu-bar>button:nth-child(4){border-top:1px solid #e0e5ea}.session-user{max-width:90px}.demo-strip{flex-wrap:wrap}.demo-strip .strip-action{margin-left:22px}.filter-select{flex-basis:100%}.filter-bar>.toolbar{flex-basis:100%}.btn{padding:6px 10px}.main{padding-left:12px;padding-right:12px}.app-header{padding-left:12px;padding-right:12px}.record-form{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Browser workspace: informational strip, no dashboard cards. */
.local-strip{display:flex;align-items:center;gap:10px;padding:10px 28px;border-bottom:1px solid #d5e0e9;background:#f0f5f9;color:#394d5e;font-size:12px;line-height:1.65}
.local-strip .icon{flex-shrink:0;width:16px;height:16px}
.local-strip>span{flex:1}.local-strip .strip-action{flex-shrink:0}
@media(max-width:680px){.local-strip{padding:9px 14px;align-items:flex-start;flex-wrap:wrap}.local-strip>span{flex-basis:calc(100% - 30px)}.local-strip .strip-action{margin-left:26px}.session-user{display:none}}
@media print{.local-strip{display:none!important}}

/* 2.3: mobile working interface, touch controls, notch and browser-toolbar safe areas. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,.btn,.table-link,.case-title{touch-action:manipulation}
.main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.page-footer{padding-bottom:max(14px,env(safe-area-inset-bottom))}
dialog{max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain}
.dialog-fallback[open]{position:fixed;z-index:999;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;box-shadow:0 0 0 100vmax #0007}
@media(max-width:760px){

<script>/* ПрофДерма 1.0.0. Детерминированная реализация предоставленной автором схемы.
 * Исследовательский прототип, а не диагностический/прогностический тест.
 * Чистая функция evaluate() не выполняет сетевые запросы и не хранит данные.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ProfDermaEngine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const VERSION = '1.0.0';
  const ENUMS = Object.freeze({
    genotype: ['', 'GT', 'GG', 'TT', 'unknown'],
    exposure: ['', 'yes', 'no', 'unknown'],
    continueWork: ['', 'yes', 'no', 'undecided'],
    dermatitis: ['', 'confirmed', 'suspected', 'none', 'unknown'],
    tenure: ['', 'yes', 'no', 'unknown'],
    workRelation: ['', 'yes', 'no', 'unknown']
  });
  const LABELS = Object.freeze({
    genotype: {'': 'Не заполнено', GT: 'G/T', GG: 'G/G', TT: 'T/T', unknown: 'Не определен / результат неизвестен'},
    exposure: {'': 'Не заполнено', yes: 'Есть текущий контакт', no: 'Текущего контакта нет', unknown: 'Контакт не уточнен'},
    continueWork: {'': 'Не заполнено', yes: 'Намерен продолжать', no: 'Не намерен продолжать', undecided: 'Решение не принято'},
    dermatitis: {'': 'Не заполнено', confirmed: 'Диагноз установлен врачом', suspected: 'Есть подозрение, диагноз не подтвержден', none: 'Дерматит не установлен, проявления не указаны', unknown: 'Клинический статус не уточнен'},
    tenure: {'': 'Не заполнено', yes: 'Есть стаж с указанными факторами', no: 'Стажа с указанными факторами нет', unknown: 'Стаж не уточнен'},
    workRelation: {'': 'Не заполнено', yes: 'Отмечена по анамнезу', no: 'По анамнезу не отмечена', unknown: 'Не уточнена'}
  });
  const CAUTION = 'Проект маршрута предназначен для рассмотрения врачом. Диагноз, связь заболевания с профессией и профессиональную пригодность определяет врач по результатам обследования.';
  const LIMITATIONS = [
    'Генотип G/T rs890293 CYP2J2 — входное условие маршрутизации. Индивидуальная оценка состояния здоровья требует клинических данных и профессионального анамнеза.',
    'Намерение продолжить работу не является медицинским допуском. Намерение прекратить работу не означает, что контакт фактически прекращен.',
    'Продолжительность стажа рассматривается совместно с условиями труда, характером контакта и клиническими данными.',
    'Отсутствие текущего контакта не исключает предшествующую экспозицию. Другой или неизвестный генотип не означает отсутствие риска и не ограничивает обычную медицинскую помощь.'
  ];
  function cleanString(value, max) {
    if (value == null) return '';
    if (typeof value !== 'string') throw new TypeError('Текстовое поле должно быть строкой.');
    const out = value.trim();
    if (out.length > max) throw new RangeError('Слишком длинное текстовое поле: максимум ' + max + ' символов.');
    return out;
  }
  function canonicalGenotype(value) {
    if (typeof value !== 'string') return value;
    if (value === 'unknown' || value === '') return value;
    const g = value.toUpperCase().replace(/[\s\/|]/g, '');
    return g === 'TG' ? 'GT' : g;
  }
  function normalize(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new TypeError('Ожидается объект карточки случая.');
    const d = {};
    for (const [key, allowed] of Object.entries(ENUMS)) {
      let value = raw[key] == null ? '' : raw[key];
      if (key === 'genotype') value = canonicalGenotype(value);
      if (!allowed.includes(value)) throw new TypeError('Недопустимое значение поля ' + key + '.');
      d[key] = value;
    }
    // Не сохраняем скрытый ответ, когда текущего контакта нет или он неизвестен.
    if (d.exposure !== 'yes') d.continueWork = '';
    d.caseCode = cleanString(raw.caseCode, 64);
    d.profession = cleanString(raw.profession, 160);
    d.agents = cleanString(raw.agents, 600);
    d.note = cleanString(raw.note, 1600);
    d.examDate = cleanString(raw.examDate, 10);
    if (d.examDate) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d.examDate)) throw new TypeError('Дата должна иметь формат ГГГГ-ММ-ДД.');
      const date = new Date(d.examDate + 'T12:00:00Z');
      if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0,10) !== d.examDate) throw new TypeError('Некорректная календарная дата.');
    }
    d.tenureYears = null;
    if (raw.tenureYears !== '' && raw.tenureYears != null) {
      if (!['string','number'].includes(typeof raw.tenureYears)) throw new TypeError('Стаж должен быть числом.');
      const str = String(raw.tenureYears).trim().replace(',', '.');
      if (!/^\d+(?:\.\d+)?$/.test(str)) throw new TypeError('Стаж: укажите неотрицательное число лет.');
      const n = Number(str);
      if (!Number.isFinite(n) || n < 0 || n > 100) throw new RangeError('Стаж должен находиться в пределах 0–100 лет. Это техническая проверка ввода, не медицинский порог.');
      d.tenureYears = n;
    }
    d.isDemo = raw.isDemo === true;
    return d;
  }
  function validate(data) {
    const errors = [];
    const names = {genotype:'Результат генотипирования', exposure:'Текущий контакт', dermatitis:'Клинический статус', tenure:'Стаж с указанными факторами', continueWork:'Намерение продолжать работу'};
    const required = ['genotype','exposure','dermatitis','tenure'];
    if (data.exposure === 'yes') required.push('continueWork');
    required.forEach(k => { if (!data[k]) errors.push({field:k, message:'Заполните поле «' + names[k] + '». При отсутствии сведений выберите «Неизвестно / не уточнено».'}); });
    if (data.tenure === 'yes' && data.tenureYears === 0) errors.push({field:'tenureYears',message:'Указан имеющийся стаж, но его длительность равна 0. Уточните значение или оставьте длительность пустой.'});
    if (data.tenure === 'no' && data.tenureYears > 0) errors.push({field:'tenureYears',message:'Указано отсутствие стажа, но введена положительная длительность. Исправьте противоречие.'});
    if (data.tenure === 'unknown' && data.tenureYears != null) errors.push({field:'tenureYears',message:'При неизвестном стаже длительность должна быть пустой. Уточните статус стажа.'});
    return errors;
  }
  function evaluate(raw) {
    let d;
    try { d = normalize(raw); } catch (e) {
      return {version:VERSION, status:'invalid', routeCode:'INVALID', title:'Проверьте введенные данные', errors:[{field:'',message:e.message}], data:null, trace:[], actions:[], alerts:[], specialists:[], caution:CAUTION};
    }
    const errors = validate(d);
    if (errors.length) return {version:VERSION,status:'invalid',routeCode:'INVALID',title:'Заполните обязательные поля',errors,data:d,trace:[],actions:[],alerts:[],specialists:[],caution:CAUTION};
    const r = {version:VERSION,status:'routed',routeCode:'',title:'',summary:'',data:d,errors:[],trace:[],actions:[],alerts:[],specialists:[],caution:CAUTION,expert:{code:'not_applicable',title:'Экспертный блок',text:'Необходимость экспертизы определяет профпатолог по клинико-профессиональным данным.'}};
    const trace = (id,label,origin='source') => r.trace.push({id,label,origin});
    const alert = (text,level='info') => r.alerts.push({level,text});
    const action = (title,text,origin='source') => r.actions.push({title,text,origin});
    if (d.isDemo) alert('Вымышленные данные. Карточка не относится к реальному пациенту.');
    trace('GENOTYPE', 'rs890293 CYP2J2: ' + LABELS.genotype[d.genotype]);
    if (d.genotype !== 'GT') {
      r.status = 'outside_scope';
      r.routeCode = d.genotype === 'unknown' ? 'GENOTYPE_UNKNOWN' : 'OUTSIDE_SCOPE';
      r.title = d.genotype === 'unknown' ? 'Уточнение генотипа' : 'Индивидуальная клиническая оценка';
      r.summary = 'Генотипическая ветвь предназначена для G/T. Для указанного результата дальнейшее наблюдение определяет врач с учетом клинической картины и профессиональных воздействий.';
      trace('SCOPE_GUARD','Требуется индивидуальная оценка результата генотипирования','guard');
      action('Оценить результат генотипирования','Уточнить имеющийся лабораторный результат. Значение генотипа и показания к дополнительным исследованиям оценивает врач. Другой генотип сам по себе не означает защиты от заболевания.','guard');
      action('Сохранить обычную клиническую оценку','При дерматите или подозрении на него необходима оценка врачом независимо от генотипа; профессиональные воздействия рассматриваются отдельно от этой схемы.','guard');
      r.specialists = d.dermatitis === 'none' ? [] : ['Дерматолог', 'Аллерголог'];
      return r;
    }
    if (d.dermatitis !== 'confirmed') {
      r.status = 'needs_review';
      r.routeCode = d.dermatitis === 'none' ? 'NO_CONFIRMED_DERMATITIS' : 'DIAGNOSIS_REQUIRED';
      r.title = d.dermatitis === 'none' ? 'Клиническая оценка' : 'Сначала уточнение диагноза';
      r.summary = 'Маршрут наблюдения при аллергическом дерматите требует подтвержденного врачом диагноза. Генотип и условия труда оцениваются в совокупности с клиническими данными.';
      trace('CLINICAL_GUARD', LABELS.dermatitis[d.dermatitis], 'guard');
      if (d.dermatitis === 'none') {
        action('Определить дальнейшее наблюдение','Введены сведения об отсутствии проявлений и подтвержденного диагноза дерматита. Профилактику и дальнейшее наблюдение по условиям труда определяет врач.','guard');
      } else {
        action('Клиническая оценка','Уточнить характер кожных проявлений у дерматолога и аллерголога. Объем обследования определяет врач.','guard');
        r.specialists = ['Дерматолог','Аллерголог'];
      }
      action('Уточнить профессиональный анамнез','Описать факторы, длительность и обстоятельства контакта. При подозрении на связь проявлений с работой вопрос участия профпатолога решается врачом независимо от генотипа.','guard');
      return r;
    }
    trace('DIAGNOSIS','Аллергический дерматит установлен врачом','clarification');
    if (d.exposure === 'unknown') {
      r.status = 'needs_review'; r.routeCode = 'EXPOSURE_UNKNOWN';
      r.title = 'Нужно уточнить контакт';
      r.summary = 'Для выбора маршрута уточните текущий контакт с аллергенами и ирритантами на рабочем месте.';
      trace('EXPOSURE_UNKNOWN','Производственная экспозиция не уточнена','guard');
      action('Уточнить воздействие','Уточнить рабочие операции, вещества и материалы, фактический контакт кожи с ними и имеющиеся сведения об условиях труда. Неизвестный контакт не приравнивается к отсутствующему.','guard');
      action('Продолжить клиническое наблюдение','Вопрос маршрута пересмотреть после уточнения экспозиции; текущую медицинскую помощь не откладывать.','guard');
      r.specialists = ['Аллерголог','Дерматолог'];
      return r;
    }
    trace(d.exposure === 'yes' ? 'CONTACT_YES' : 'CONTACT_NO', LABELS.exposure[d.exposure]);
    if (d.exposure === 'yes' && d.continueWork === 'undecided') {
      r.status = 'needs_review'; r.routeCode = 'CHOICE_PENDING';
      r.title = 'Намерение работника не уточнено';
      r.summary = 'Обсудите с работником намерение продолжать работу и зафиксируйте его ответ. До уточнения решения учитывается текущий контакт.';
      trace('CHOICE_PENDING','Продолжение работы: решение не принято','guard');
      action('Обсудить условия дальнейшей работы','Обсудить с врачом и работником варианты дальнейшего контакта. Предпочтение работника фиксируется отдельно от медицинской оценки допустимости работы.','guard');
      action('Не прекращать наблюдение','При текущем контакте и установленном дерматите сохранить врачебную оценку и наблюдение до решения вопроса.','guard');
      r.specialists = ['Профпатолог','Аллерголог','Дерматолог'];
      return r;
    }
    if (d.exposure === 'yes' && d.continueWork === 'yes') {
      r.routeCode = 'CONTINUE_WORK'; r.title = 'Динамическое наблюдение';
      r.summary = 'Выбрана ветвь текущего производственного контакта и намерения продолжать работу. По авторской схеме формируется совместное наблюдение специалистов.';
      trace('CHOICE_YES','Работник намерен продолжать работу');
      trace('DYNAMIC','Профпатолог + аллерголог + дерматолог');
      r.specialists = ['Профпатолог','Аллерголог','Дерматолог'];

 state.draft=c?{...c.input}:{caseCode:`СЛ-${String(number).padStart(4,'0')}`,examDate:today(),profession:'',agents:'',note:'',genotype:'',dermatitis:'',exposure:'',continueWork:'',tenure:'',tenureYears:null,workRelation:'unknown',isDemo:state.demo};

}
const req=' <span class="required">*</span>';
function textField(name,label,placeholder='',max=160,extra=''){const d=state.draft;return `<div class="field"><label for="field-${name}">${label}</label><input id="field-${name}" name="${name}" value="${esc(d[name])}" placeholder="${placeholder}" maxlength="${max}" ${extra}></div>`;}
function selectField(name,label,options,{required=false,help='',empty=true}={}){
 const d=state.draft;
 const error=state.formErrors.some(x=>x.field===name);
 return `<div class="field"><label for="field-${name}">${label}${required?req:''}</label><select id="field-${name}" name="${name}" ${required?'aria-required="true"':''} ${error?'aria-invalid="true"':''}${help?` aria-describedby="help-${name}"`:''}>${empty?`<option value="" ${!d[name]?'selected':''}>— Выберите значение —</option>`:''}${options.map(([v,t])=>`<option value="${esc(v)}" ${d[name]===v?'selected':''}>${esc(t)}</option>`).join('')}</select>${help?`<div id="help-${name}" class="field-help">${help}</div>`:''}</div>`;
}

 <fieldset class="form-section"><legend>2. Генотип и клинический статус</legend><div class="record-grid">${selectField('genotype','rs890293 гена CYP2J2',[['GT','G/T'],['GG','G/G'],['TT','T/T'],['unknown','Не определен / результат неизвестен']],{required:true,help:'Генотипическая ветвь предназначена для G/T. Клиническая оценка необходима при любом генотипе.'})}${selectField('dermatitis','Аллергический дерматит',[['confirmed','Диагноз установлен врачом'],['suspected','Есть подозрение, диагноз не подтвержден'],['none','Не установлен, проявления не указаны'],['unknown','Клинический статус не уточнен']],{required:true,help:'Укажите клинический статус по заключению врача.'})}</div></fieldset>

 </form>`;

function updatePreview(){
 const target=document.getElementById('live-preview');if(!target)return;
 const d=state.draft,r=E.evaluate(d);
 const fields=['genotype','dermatitis','exposure','tenure'];if(d.exposure==='yes')fields.push('continueWork');
 const done=fields.filter(k=>!!d[k]).length;
 target.innerHTML=r.status==='invalid'?`<strong>Проверка данных.</strong> Заполнено условий: ${done} из ${fields.length}. ${r.errors.some(x=>x.field==='tenureYears'||!x.field)?esc(r.errors[0].message):'Заполните обязательные поля для предварительного расчета.'}`:`<strong>Предварительный результат:</strong> ${esc(r.title)}. <span class="muted">Окончательный проект доступен после сохранения.</span>`;
}
function selectedCase(){return state.cases.find(c=>c.id===state.caseId);}
function detailPage(){

 }
 if(action==='persist-local'){
  let allowed=false;try{allowed=await navigator.storage?.persist?.()||false;}catch{}

async function restoreLocalFile(input){
 const file=input.files[0];
 try{
  if(file.size>20*1024*1024)throw new Error('Копия превышает 20 МБ. Импорт не выполнен.');
  let backup;try{backup=JSON.parse(await file.text());}catch{throw new Error('Файл не содержит корректный JSON.');}
  if(backup?.appId!=='ProfDermaBrowserBackup'||backup.schemaVersion!==1||!Array.isArray(backup.cases))throw new Error('Выберите резервную копию базы ПрофДерма. Одиночные карточки добавляются через импорт в реестре.');
  if(!confirm(`Восстановить из копии ${backup.cases.length} случаев? Новые записи будут добавлены, отличающиеся дубликаты отменят импорт. Существующая база не перезаписывается.`))return;
  const result=await api('/restore','POST',backup);browserChannel?.postMessage({changed:true});await loadCases();navigate('cases');toast(`Добавлено: ${result.added}. Совпадающих записей пропущено: ${result.skipped}.`);
 }catch(e){toast(e.message,true);}finally{input.value='';}
}

 if(action==='cancel-form'){navigate('cases');return;}
 if(action==='edit'){const c=selectedCase();initForm(c);state.view='form';render();window.scrollTo(0,0);return;}
 if(action==='print'){printCase();return;}
 if(action==='share-report'){const c=selectedCase();if(!c)return;try{await navigator.share({title:'ПрофДерма · '+c.input.caseCode,text:reportText(c)});}catch(e){if(e.name!=='AbortError')toast('Используйте экспорт TXT или HTML.',true);}return;}
 if(action==='install-help'){showInstallHelp();return;}
 if(action==='export'){
  modal(`<h2>Экспорт случая</h2><p>Файлы содержат введенные клинические и генетические сведения и не шифруются. Храните их в защищенном месте.</p><div class="stack mt24">${typeof navigator.share==='function'?`<button class="btn full" data-action="share-report">${icon('upload')}Поделиться текстом</button>`:''}<button class="btn secondary full" data-action="export-json">${icon('file')}JSON · карточка для повторного импорта</button><button class="btn secondary full" data-action="export-html">${icon('file')}HTML · проект заключения</button><button class="btn secondary full" data-action="export-text">${icon('file')}TXT · текстовый проект</button></div>`);return;
 }
 if(action.startsWith('export-')){
  const c=selectedCase();
  if(action==='export-json')downloadText(fileName(c,'json'),JSON.stringify(exportObject(c),null,2),'application/json;charset=utf-8');
  if(action==='export-html')downloadText(fileName(c,'html'),`<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>ПрофДерма — ${esc(c.input.caseCode)}</title><style>${document.getElementById('report-style').textContent}</style><body class="export-report">${reportHtml(c)}</body></html>`,'text/html;charset=utf-8');
  if(action==='export-text'){
   downloadText(fileName(c,'txt'),reportText(c),'text/plain;charset=utf-8');
  }
  closeModal();toast('Файл подготовлен.');return;
 }
 if(action==='delete'){const c=selectedCase();modal(`<h2>Удалить ${esc(c.input.caseCode)}?</h2><p>Карточка и ее история будут удалены из рабочей базы. Действие нельзя отменить в приложении. Уже выгруженные файлы и внешние резервные копии не удаляются.</p><div class="dialog-actions"><button class="btn secondary" data-action="close-modal">Отмена</button><button class="btn danger" data-action="confirm-delete">Удалить случай</button></div>`);return;}
 if(action==='confirm-delete'){const c=selectedCase();if(!state.demo)await api('/cases/'+c.id,'DELETE',{version:c.version});if(local&&!state.demo)browserChannel?.postMessage({changed:true});state.cases=state.cases.filter(x=>x.id!==c.id);closeModal();navigate('cases');toast('Случай и его история удалены из рабочей базы.');return;}
 if(action==='audit'){
  const out=await api('/audit');const labels={setup:'Первичная настройка',login:'Вход в кабинет',logout:'Выход',create_case:'Создание случая',update_case:'Изменение случая',delete_case:'Удаление случая',password_change:'Смена пароля',password_recovery:'Восстановление пароля администратором сервера',create_user:'Создание учетной записи'};
  modal(`<h2>Журнал действий</h2><p>Последние 100 событий вашего кабинета. Содержимое клинических полей в журнал не записывается.</p>${out.events.map(e=>`<div class="audit-event"><span>${esc(labels[e.action]||e.action)}</span><span class="muted">${dateTime(e.created_at)}</span></div>`).join('')}`);return;
 }
 if(action==='list-users'){const out=await api('/users');modal(`<h2>Учетные записи</h2><p>Доступ к карточкам между специалистами не предоставляется.</p>${out.users.map(u=>`<div class="audit-event"><div><strong>${esc(u.displayName)}</strong><br><span class="muted">${esc(u.username)}</span></div><span class="badge outline">${u.role==='admin'?'Администратор':'Специалист'}</span></div>`).join('')}`);return;}
 if(action==='add-user'){
  modal(`<h2>Новый специалист</h2><p>Специалист получит собственный кабинет без доступа к вашим случаям.</p><form id="user-form"><div class="field"><label for="user-name">Отображаемое имя</label><input id="user-name" name="displayName" required maxlength="100" autocomplete="off"></div><div class="field"><label for="user-login">Логин</label><input id="user-login" name="username" required pattern="[a-zA-Z0-9_.-]{3,40}" maxlength="40" autocomplete="off"><div class="field-help">3–40 латинских букв, цифры, точка, дефис или подчеркивание.</div></div><div class="field"><label for="user-password">Начальный пароль</label><input id="user-password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><div class="field-help">Передайте пароль защищенным способом. После входа специалист может изменить его в настройках.</div></div><div id="user-error"></div><button type="submit" class="btn full">Создать учетную запись</button></form>`);return;
 }
}
document.addEventListener('click',async ev=>{
 const target=ev.target.closest('[data-action],[data-nav],[data-case],[data-tab],[data-history-version]');if(!target)return;
 try{
  if(target.dataset.nav){navigate(target.dataset.nav);return;}
  if(target.dataset.case){navigate('detail',target.dataset.case);return;}
  if(target.dataset.tab){if(target.dataset.tab==='history')await showHistory();else{state.detailTab=target.dataset.tab;render();}return;}
  if(target.dataset.historyVersion){const v=state.history.find(x=>x.version===Number(target.dataset.historyVersion));modal(`<h2>Версия ${v.version}</h2><p>${dateTime(v.savedAt)} · ${esc(v.result.title)}</p><dl class="facts">${inputFacts(v.input).map(([k,val])=>`<div><dt>${esc(k)}</dt><dd>${esc(val||'Не указано')}</dd></div>`).join('')}</dl>`);return;}
  if(target.dataset.action){target.disabled=true;try{await handleAction(target.dataset.action,target);}finally{target.disabled=false;}}
 }catch(e){toast(e.message,true);}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.id==='case-search'){state.query=t.value;document.getElementById('case-results').innerHTML=tableMarkup(filteredCases(),true);document.getElementById('search-count').textContent=filteredCases().length;return;}
 if(t.closest('#case-form')&&t.name){state.draft[t.name]=t.value;state.dirty=true;
  if(t.name==='exposure'){if(t.value!=='yes')state.draft.continueWork='';document.getElementById('continue-section').hidden=t.value!=='yes';if(t.value!=='yes')document.getElementById('field-continueWork').value='';}
  if(t.name==='tenure'){if(t.value!=='yes')state.draft.tenureYears=null;document.getElementById('tenure-section').hidden=t.value!=='yes';if(t.value!=='yes')document.getElementById('field-tenureYears').value='';}
  updatePreview();
 }
});
document.addEventListener('change',async ev=>{
 const t=ev.target;
 if(t.id==='restore-file'&&t.files[0]){await restoreLocalFile(t);return;}
 if(t.id==='status-filter'){state.filter=t.value;document.getElementById('case-results').innerHTML=tableMarkup(filteredCases(),true);document.getElementById('search-count').textContent=filteredCases().length;}
 if(t.id==='import-file'&&t.files[0]){
  const file=t.files[0];try{
   if(file.size>256*1024)throw new Error('JSON-файл превышает 256 КиБ.');
   if(state.dirty&&!confirm('Заменить несохраненную анкету данными из файла?'))return;
   let parsed;try{parsed=JSON.parse(await file.text());}catch{throw new Error('Файл не содержит корректный JSON.');}
   if(parsed?.appId!=='ProfDerma'||parsed.schemaVersion!==1||!parsed.input)throw new Error('Ожидается карточка JSON ПрофДерма, schemaVersion = 1.');
   const r=E.evaluate(parsed.input);if(r.status==='invalid')throw new Error(r.errors.map(e=>e.message).join(' '));
   initForm();state.draft={...r.data,isDemo:state.demo||r.data.isDemo};state.view='form';state.dirty=true;render();window.scrollTo(0,0);toast('Карточка импортирована в анкету. Проверьте данные и сохраните случай.');
  }catch(e){toast(e.message,true);}finally{t.value='';}
 }
});
document.addEventListener('submit',async ev=>{
 const form=ev.target;ev.preventDefault();
 if(form.id==='case-form'){await saveCase();return;}
 const btn=form.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
 try{
  const data=Object.fromEntries(new FormData(form));
  if(form.id==='auth-form'){
   const out=await api(state.authMode==='setup'&&state.setupRequired?'/setup':'/login','POST',data);
   state.user=out.user;state.csrf=out.csrfToken;state.setupRequired=false;state.demo=false;state.view='cases';state.draft=null;state.dirty=false;await loadCases();render();window.scrollTo(0,0);
  }
  if(form.id==='password-form'){const out=await api('/password','POST',data);state.csrf=out.csrfToken;form.reset();toast('Пароль изменен. Другие сеансы завершены.');}
  if(form.id==='user-form'){await api('/users','POST',data);closeModal();toast('Специалист создан.');}
 }catch(e){
  if(form.id==='auth-form'){document.getElementById('auth-error').innerHTML=`<div class="error-box" role="alert">${esc(e.message)}</div>`;state.user=null;state.csrf=null;}
  else if(form.id==='user-form')document.getElementById('user-error').innerHTML=`<div class="error-box" role="alert">${esc(e.message)}</div>`;
  else toast(e.message,true);
 }finally{if(btn)btn.disabled=false;}
});
let browserChannel;
if(local&&'BroadcastChannel' in window){browserChannel=new BroadcastChannel('profderma-browser-updates');browserChannel.onmessage=()=>{if(!state.demo)toast('Локальная база изменена в другой вкладке. Перед редактированием обновите реестр.');};}
window.addEventListener('beforeunload',ev=>{if(state.dirty){ev.preventDefault();ev.returnValue='';}});
window.addEventListener('afterprint',()=>document.querySelector('.print-report')?.remove());
async function start(){
 if(offline){enterDemo();return;}
 try{const out=await api('/me');state.user=out.user;state.csrf=out.csrfToken;state.setupRequired=out.setupRequired;state.authMode=out.setupRequired?'setup':'login';if(state.user)await loadCases();render();}
 catch(e){state.user=null;if(local){renderLocalFailure(e);}else{renderAuth();toast(e.message,true);}}
}
start();
})();
</script>
</body></html>

name: Verify public ProfDerma on mobile browsers
on:
  push:
    branches: [profderma-web]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Verify published app and mobile interaction
        run: python3 tests/live_mobile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profderma-browser-verification
          path: test-output/

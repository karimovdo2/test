name: ProfDerma publication preparation
on:
  push:
    branches: [profderma-web]
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages --jq '{html_url,build_type,source,status}'
